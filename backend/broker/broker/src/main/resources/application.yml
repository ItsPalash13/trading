spring:
  application:
    name: trading
  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

api:
  user:
    v1:
      enabled: true

security:
  prohibited-time:
    enabled: true
    start: "18:02"
    end: "18:03"
    zone-id: Asia/Kolkata

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings,beans,threaddump
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    name: trading
    version: 0.0.1-SNAPSHOT

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: TRACE

diagnostics:
  jfr:
    enabled: true
    name: broker
    settings: profile
    directory: target/jfr
    max-age: 30m
    max-size: 256MB
    dump-on-exit: true
    http:
      stack-trace: true
